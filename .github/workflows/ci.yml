name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # path 门控判定（P4）：ios 只关心 shared/core/gradle 变更；后端/文档/CI 改动不花 macOS 分钟
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'app/shared/**'
              - 'core/**'
              - 'gradle/**'
              - '*.kts'
              - 'gradle.properties'
              - 'libs.versions.toml'

  # 快速门禁（P2）：jvm 测试 + 语义/门禁断言 + F 门禁 + 对比度；其他 job 以它为 needs 前提
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # F 约束门禁（Plan B：detekt 2.0 转正后迁移，见 scripts/lint/f_gates.py 头注）
      - name: F gates (F1/F2/F6)
        run: python scripts/lint/f_gates.py

      # 对比度门禁（frontend-design-system §10.3 / F16）
      - name: Contrast gate
        run: python scripts/a11y/contrast.py

      - name: Test (core + shared jvm)
        run: ./gradlew :core:jvmTest :app:shared:jvmTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/shared/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      - name: Build Android debug
        run: ./gradlew :app:androidApp:assembleDebug --console=plain

  desktop:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      - name: Package desktop deb
        run: ./gradlew :app:desktopApp:packageDeb --console=plain

  web:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      - name: Build web (js + wasmJs)
        run: ./gradlew :app:webApp:jsBrowserDistribution :app:webApp:wasmJsBrowserDistribution --console=plain

  ios:
    runs-on: macos-latest
    needs: [test, changes]
    if: needs.changes.outputs.ios == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gradle-setup
      - name: Link iOS framework (simulator)
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
